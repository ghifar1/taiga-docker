{{- if and .Values.enabled (or .Values.extraConfiguration .Values.defaultVhost) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}-config
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
data:
  rabbitmq.conf: |
    {{- if .Values.defaultVhost }}
    default_vhost = {{ .Values.defaultVhost }}
    {{- end }}
    {{- with .Values.extraConfiguration }}
{{ . | indent 4 }}
    {{- end }}
{{- end }}
